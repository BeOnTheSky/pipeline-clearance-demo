name: pipeline-clearance-demo
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pipeline_demo
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline_demo
    volumes:
      - pipeline_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/pipeline_demo
      DB_USER: pipeline
      DB_PASSWORD: pipeline_demo
    depends_on:
      db:
        condition: service_healthy
volumes:
  pipeline_data:

