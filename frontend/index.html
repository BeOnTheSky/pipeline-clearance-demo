<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101922" />
    <title>地下管线三维净距分析</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">↳</div>
      <div>
        <h1>地下管线三维净距分析</h1>
      </div>
      <span class="sample-badge">街区管网 · 单位 m</span>
    </header>
    <main class="workspace">
      <section class="viewport" aria-label="地下管线三维街区">
        <div id="scene"></div>
        <div class="view-heading">
          <span class="live-dot"></span>地下管网<span id="pipeline-count">加载中</span>
        </div>
        <div class="view-tools">
          <select id="ground-mode" class="view-reset" aria-label="地表显示">
            <option value="solid">实体地表</option>
            <option value="transparent" selected>透明地表</option>
            <option value="hidden">隐藏地表</option>
          </select>
          <button id="overview" class="view-reset" type="button">街区总览</button>
          <button id="reset-view" class="view-reset" type="button">定位管网</button>
        </div>
        <div id="scene-message" class="scene-message" role="status">正在加载街区与管线…</div>
        <div class="view-legend">
          <span><i style="--color: #46b8eb"></i>供水</span>
          <span><i style="--color: #f2b84b"></i>燃气</span>
          <span><i style="--color: #7cc3a1"></i>排水</span>
          <span><i style="--color: #bd9bed"></i>电力</span>
          <span><i style="--color: #8cabbf"></i>通信</span>
          <span class="legend-separator"></span>
          <span><i style="--color: #f4f8ff"></i>选中</span>
          <span><i style="--color: #ff6b64"></i>冲突</span>
        </div>
        <div class="view-footer">
          <span>拖动旋转 · 滚轮缩放 · 右键平移</span>
          <span id="ground-info">Z ↑ · 地表 0.00 m</span>
        </div>
      </section>
      <aside class="analysis-panel view-mode">
        <section class="selection-section">
          <div class="panel-heading">
            <h2 id="editor-heading">管线管理</h2>
            <div id="view-actions" class="inline-actions">
              <button id="edit-pipeline" class="text-button" type="button" disabled>编辑</button>
              <button id="delete-pipeline" class="text-button danger" type="button" disabled>
                删除
              </button>
            </div>
          </div>
          <div class="pipeline-picker">
            <select id="pipeline-select" aria-label="选中管线" disabled>
              <option value="">加载中…</option>
            </select>
            <button id="new-pipeline" class="secondary-button" type="button" disabled>
              ＋ 新建
            </button>
          </div>
          <div id="pipeline-meta" class="pipeline-meta">
            <span id="pipeline-type">类型 —</span>
            <span id="pipeline-radius">外半径 —</span>
          </div>
          <form id="pipeline-form">
            <div id="edit-fields" class="edit-fields" hidden>
              <label class="full-field"
                >管线名称
                <input id="pipeline-name" maxlength="80" required />
              </label>
              <label
                >管线类型
                <select id="pipeline-type-input">
                  <option>供水</option>
                  <option>燃气</option>
                  <option>排水</option>
                  <option>电力</option>
                  <option>通信</option>
                </select>
              </label>
              <label
                >外半径（m）
                <input
                  id="pipeline-radius-input"
                  type="number"
                  min="0.000001"
                  step="any"
                  required
                />
              </label>
            </div>
            <div class="vertices-heading">
              <h3>顶点坐标 <span>m</span></h3>
              <div class="vertex-insert-actions">
                <button id="prepend-point" class="text-button" type="button" hidden>
                  ＋ 首部添加
                </button>
                <button id="add-point" class="text-button" type="button" hidden>＋ 末尾添加</button>
              </div>
            </div>
            <div class="vertex-scroll">
              <table class="vertex-table">
                <thead>
                  <tr>
                    <th>点</th>
                    <th>X</th>
                    <th>Y</th>
                    <th>Z</th>
                    <th class="point-actions">操作</th>
                  </tr>
                </thead>
                <tbody id="vertices"></tbody>
              </table>
            </div>
            <div id="save-actions" class="save-actions" hidden>
              <button id="save-pipeline" class="primary-button" type="submit">保存管线</button>
              <button id="cancel-edit" class="secondary-button" type="button">取消</button>
            </div>
          </form>
          <p id="editor-status" class="editor-status" role="status" hidden></p>
          <div id="analysis-controls" class="analysis-controls">
            <label for="threshold">净距阈值（m）</label>
            <input id="threshold" type="number" value="0.40" min="0" step="0.01" required />
            <button id="analyze" class="primary-button" type="button" disabled>冲突分析</button>
          </div>
        </section>
        <div
          id="panel-resizer"
          class="panel-resizer"
          role="separator"
          aria-label="调整管线信息和分析结果的高度"
          aria-orientation="horizontal"
          aria-valuenow="52"
          tabindex="0"
          title="上下拖动调整高度，双击恢复"
        ></div>
        <section id="results-section" class="results-section">
          <div class="results-heading">
            <h2>分析结果</h2>
            <span id="result-summary">未分析</span>
          </div>
          <div class="result-column-heading">
            <span>目标管线 / 中心线距离</span><span>外壁净距 ↑</span>
          </div>
          <p id="result-message" class="empty-message" role="status" hidden></p>
          <div id="results"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
